name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Supabase configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY as repository Actions secrets."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          value = os.environ["SUPABASE_URL"].strip()
          if value.startswith("SUPABASE_URL="):
              value = value[len("SUPABASE_URL="):].strip()
          if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
              value = value[1:-1].strip()

          parsed = urlparse(value)
          expected_host = "oulufhpzmywuftxzfkfj.supabase.co"
          if parsed.scheme != "https" or parsed.hostname != expected_host:
              raise SystemExit(
                  "SUPABASE_URL must be the HTTPS API URL for the FSEGN project. "
                  "The saved GitHub secret does not match."
              )
          print("Supabase project URL check passed.")
          PY

      - name: Configure Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsegn-study-groups-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="beta-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "FSEGN Study Groups Beta ${GITHUB_RUN_NUMBER}" \
            --notes "Install this beta APK directly on Android. Built from commit ${GITHUB_SHA}." \
            --latest
